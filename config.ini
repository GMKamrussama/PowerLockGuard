[PowerLockGuard]
ChargerGuardEnabled=True
ChargerGuardAction=Sleep
WatchdogEnabled=False
WatchdogAction=Sleep
WatchdogMode=AgentsAndBuilds
WatchdogTargetProcess=claude
WatchdogGraceMinutes=10
WatchdogIdleThreshold=5.0
AutoKillStuckAgentsOnSleep=False
StartWithWindows=False
PlayAlertSound=True
CountdownSeconds=30
